name: Release and Publish To Maven Central

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up Java
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Validate release tag
        run: |
          project_version="$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "$project_version" == *-SNAPSHOT ]]; then
            echo "::error::Cannot publish SNAPSHOT version $project_version as a release."
            exit 1
          fi
          if [[ "v$project_version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match POM version $project_version."
            exit 1
          fi
      - name: Test and publish to Maven Central
        run: ./mvnw -B --no-transfer-progress deploy
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
      - name: Deploy Javadoc
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/target/reports/apidocs
          destination_dir: ./
      - name: Create Release
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: ${{ github.ref_name }}
          prerelease: false
          generateReleaseNotes: true
          commit: ${{ github.ref_name }}
          artifacts: >
            **/target/pbj-pbcs-client-*.jar
